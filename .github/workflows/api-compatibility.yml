name: api-compatibility

# Names every backwards-incompatible change a pull request makes to the public
# API, so the release notes can name it too.
#
# Release notes are written by hand when a release is published, and
# update-changelog.yml copies them into CHANGELOG.md. A break that is only
# described in a pull request body is easy to leave out of them. This job finds
# them mechanically instead.
#
# It compares the pull request with its base, not with the latest release, so
# it reports a break on the pull request that makes it and on no other. For the
# whole list when writing release notes, run the same tool locally with
# --from=<latest tag>.
#
# It reports and does not block: the package is 0.x and breaks are allowed. A
# break is a yellow warning on a green check, listed in the job summary, and it
# means "say this in the release notes", not "undo it". The check goes red only
# when the checker itself fails, so red keeps meaning something is broken. Mark
# a class @internal to take it out of the public API, and out of this report.
#
# Needs no secrets, like run-tests.yml.

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/api-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backwards-compatibility:
    name: Public API breaks in this pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The checker reads the base commit out of git history.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Install the checker outside the project
        # Not a dev dependency: its own requirements would have to agree with
        # every Laravel and Testbench version the test matrix installs.
        # It installs each revision's dependencies itself, so the project's are
        # not installed here.
        run: composer global require --no-interaction --no-progress "roave/backward-compatibility-check:^8.27"

      - name: Compare with the base of this pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "Comparing with ${BASE}."

          set +e
          "$(composer global config bin-dir --absolute)/roave-backward-compatibility-check" \
            --from="${BASE}" --format=github-actions --format=markdown > report.txt
          status=$?
          set -e

          # Each break becomes a warning annotation, and the markdown list goes
          # to the job summary, where the release notes can be copied from.
          sed -n 's/^::error/::warning/p' report.txt
          grep -v '^::' report.txt >> "$GITHUB_STEP_SUMMARY" || true

          # The checker exits 3 when it finds breaks. Anything else non-zero is
          # the checker failing, which stays red.
          case "$status" in
            0) echo "No public API breaks." ;;
            3) echo "Public API breaks found. Name them in the release notes." ;;
            *) cat report.txt; exit "$status" ;;
          esac
