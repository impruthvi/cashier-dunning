name: run-tests

# CONTRACT: this workflow must NEVER require a repository secret.
#
# The whole point of this package is that replaying a recorded billing lifecycle
# needs no Stripe account, no API keys and no network. That property is only real
# if it is enforced here: GitHub withholds secrets from pull requests opened by
# forks, so if these jobs ever depend on one, every outside contributor's PR
# turns red and the claim on the README becomes false.
#
# Anything that talks to Stripe belongs in record-drift.yml.

# Pull requests always run, so the gate job below reports on every one, docs-only
# included. The matrix itself only runs when code changed: the `changes` job
# applies the same paths `push` filters on. A push to main already ran as a pull
# request, so only main is built on push, and every PR push runs the matrix once.
on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
  # Release automation dispatches this for changelog PRs opened with GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout code
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match the paths push filters on
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push only gets here through the paths filter above.
          if [ "$EVENT" = "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Dispatched runs compare their branch with main, just like a PR.
          if git diff --name-only "$BASE...$HEAD" \
            | grep -qE '\.php$|^\.github/workflows/run-tests\.yml$|^phpunit\.xml\.dist$|^composer\.(json|lock)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code paths changed; the test matrix is skipped."
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Every cell runs even after one goes red. The support matrix is decided
      # from which combinations pass, and fail-fast reports the first failure
      # instead of the set — which is the answer this matrix exists to give.
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # No Laravel 11. It no longer receives security fixes, and advisories
        # against every 11.x release (PKSA-b41t-wbzk-9q51, a critical TokenGuard
        # bypass, among them) mean Composer 2.11 refuses to install any of them.
        # Turning that refusal off here would put a green cell on a combination
        # users cannot install.
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '13.*'
            testbench: '11.*'
          - laravel: '12.*'
            testbench: '10.*'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Locate the Composer download cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        # Every cell downloads the same archives from codeload.github.com, which
        # answers a full matrix with HTTP 429.
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-p${{ matrix.php }}-l${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      - name: Assert no Stripe credentials are present
        # Guards the contract above. If a future change makes the suite depend on
        # a key, this fails loudly here rather than silently on a contributor's PR.
        run: |
          if [ -n "${STRIPE_SECRET:-}${STRIPE_TEST_SECRET:-}${CASHIER_SECRET:-}" ]; then
            echo "::error::Stripe credentials leaked into the replay workflow. Move that work to record-drift.yml."
            exit 1
          fi
          echo "No Stripe credentials present. Replay must work without them."

      - name: Execute tests
        run: vendor/bin/pest --ci

  windows-smoke:
    # One cell, not twelve. The package has no shell dependencies (events are read
    # back over the Stripe API rather than via the Stripe CLI), so Windows needs a
    # smoke check, not full matrix coverage.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    name: Windows smoke (P8.4 - L13)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Locate the Composer download cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        # Every cell downloads the same archives from codeload.github.com, which
        # answers a full matrix with HTTP 429.
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-windows-smoke-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci

  stripe:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        stripe: ['^17.4', '^18.0', '^19.0', '^20.0', '^21.0']

    name: Stripe ${{ matrix.stripe }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Locate the Composer download cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        # Every cell downloads the same archives from codeload.github.com, which
        # answers a full matrix with HTTP 429.
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-stripe${{ matrix.stripe }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "stripe/stripe-php:${{ matrix.stripe }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci

  gate:
    # The one check to require on main. Branch protection cannot require a job
    # that might not run, and the matrix cells are skipped on docs-only pull
    # requests, so this job always runs and stands for all of them.
    name: Tests gate
    if: always()
    needs: [changes, test, windows-smoke, stripe]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report the test result
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TEST: ${{ needs.test.result }}
          WINDOWS: ${{ needs.windows-smoke.result }}
          STRIPE: ${{ needs.stripe.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection ended with '$CHANGES'."
            exit 1
          fi

          if [ "$CODE" != "true" ]; then
            echo "No code paths changed, so the test matrix did not run."
            exit 0
          fi

          echo "test: $TEST, windows-smoke: $WINDOWS, stripe: $STRIPE"
          if [ "$TEST" != "success" ] || [ "$WINDOWS" != "success" ] || [ "$STRIPE" != "success" ]; then
            echo "::error::The test matrix did not pass."
            exit 1
          fi
