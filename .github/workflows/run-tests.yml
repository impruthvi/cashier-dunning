name: run-tests

# CONTRACT: this workflow must NEVER require a repository secret.
#
# The whole point of this package is that replaying a recorded billing lifecycle
# needs no Stripe account, no API keys and no network. That property is only real
# if it is enforced here: GitHub withholds secrets from pull requests opened by
# forks, so if these jobs ever depend on one, every outside contributor's PR
# turns red and the claim on the README becomes false.
#
# Anything that talks to Stripe belongs in record-drift.yml.

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Every cell runs even after one goes red. The support matrix is decided
      # from which combinations pass, and fail-fast reports the first failure
      # instead of the set — which is the answer this matrix exists to give.
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '13.*'
            testbench: '11.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '11.*'
            testbench: '^9.13'
        exclude:
          # Laravel 11's constraint is php ^8.2, so Composer will happily install
          # it on 8.5 — but 11.x shipped before 8.5 existed and is not tested
          # against it upstream. A green cell here would advertise a combination
          # nobody supports.
          - laravel: '11.*'
            php: '8.5'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      - name: Assert no Stripe credentials are present
        # Guards the contract above. If a future change makes the suite depend on
        # a key, this fails loudly here rather than silently on a contributor's PR.
        run: |
          if [ -n "${STRIPE_SECRET:-}${STRIPE_TEST_SECRET:-}${CASHIER_SECRET:-}" ]; then
            echo "::error::Stripe credentials leaked into the replay workflow. Move that work to record-drift.yml."
            exit 1
          fi
          echo "No Stripe credentials present. Replay must work without them."

      - name: Execute tests
        run: vendor/bin/pest --ci

  windows-smoke:
    # One cell, not twelve. The package has no shell dependencies (events are read
    # back over the Stripe API rather than via the Stripe CLI), so Windows needs a
    # smoke check, not full matrix coverage.
    runs-on: windows-latest
    timeout-minutes: 5
    name: Windows smoke (P8.4 - L13)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
